<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  One Cocreation logo lockup v6 RAYLIT VARIANT: both words lit by one shared
  gradient anchored at the star center, falling from warm gold to deep violet
  along the down-right light diagonal (per logo-suggestions1.png). Transparent ground throughout - every luminous element
  fades to transparent (no opaque white fills). Torus ring lit top-left with feathered
  highlight/shade arcs (replaces the old hard-ended glint strokes) and inner-rim reflection.
  Soft shadow behind the star for lift. Star interior per onecocreation-mark-gold.svg.
  Wordmark: outlined Poppins-match paths, airy tracking (+6.8/letter).
  Merch-grade follow-up: reconcile against the layered GIMP source (logo one cocreation.xcf).
-->

