# .githooks/law.conf — settings read by pre-commit and pre-push. Tracked with the repo.
# Armed per clone with:  git config core.hooksPath .githooks
# AUTHOR_EMAIL: the only author email a commit may carry ("" = no check). Vercel silently BLOCKS other authors.
AUTHOR_EMAIL="pac@pacsarcade.org"
# PROTECTED: space-separated branch names whose pushes re-run the gate, fail-closed.
PROTECTED="main"
# GATE: the gate command; "{top}" is replaced with the repo's top level. Exit 0 = green.
# The gate script is the builder's own tooling and lives outside this repo, so its path is
# set per clone, never tracked here:  git config lawguard.gate "/path/to/gate.sh {top}"
# Unset = every push to a protected branch is refused (fail-closed).
GATE="$(git config --get lawguard.gate || true)"
