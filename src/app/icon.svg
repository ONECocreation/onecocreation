  <ellipse cx="75.5" cy="143" rx="51" ry="7.5" fill="url(#coinShadowM)"/>

  <!-- gold torus: diagonal light (top-left) with feathered highlight/shade arcs + inner-rim reflection -->
  <circle cx="72" cy="72" r="59" fill="none" stroke="url(#ringGoldM)" stroke-width="17"/>
  <circle cx="72" cy="72" r="59.5" fill="none" stroke="url(#ringRidgeM)" stroke-width="6" opacity="0.6"/>
  <circle cx="72" cy="72" r="67.4" fill="none" stroke="#67309D" stroke-width="2.4" opacity="0.5"/>
  <circle cx="72" cy="72" r="50.9" fill="none" stroke="#2E1656" stroke-width="2.4" opacity="0.96"/>
  <circle cx="72" cy="72" r="52.7" fill="none" stroke="url(#ringInnerBevelM)" stroke-width="1.5" opacity="0.7"/>
  <path d="M16.56 92.18 A59 59 0 0 1 92.18 16.56" fill="none" stroke="url(#hiArcM)" stroke-width="8" stroke-linecap="round"/>
  <path d="M127.44 51.82 A59 59 0 0 1 51.82 127.44" fill="none" stroke="url(#shArcM)" stroke-width="9" stroke-linecap="round"/>
  <path d="M120.68 89.72 A51.8 51.8 0 0 1 38.7 111.68" fill="none" stroke="url(#reflArcM)" stroke-width="2.2" stroke-linecap="round"/>

  <circle cx="76" cy="76.5" r="36" fill="url(#starShadowM)"/>
  <circle cx="72" cy="72" r="40.8" fill="url(#starGlowM)"/>
  <path d="M86.42 86.42L72.00 75.40L57.58 86.42L68.60 72.00L57.58 57.58L72.00 68.60L86.42 57.58L75.40 72.00Z" fill="url(#starBodyM)" opacity="0.85"/>
  <path d="M109.06 72.00L74.64 74.64L72.00 109.06L69.36 74.64L34.94 72.00L69.36 69.36L72.00 34.94L74.64 69.36Z" fill="url(#starBodyM)"/>
  <circle cx="72" cy="72" r="21.6" fill="url(#coreBloomM)"/>
  <circle cx="72" cy="72" r="7.5" fill="url(#coreDotM)"/>
