<?xml version="1.0" encoding="UTF-8"?>
<!--
  One Cocreation "O" mark alone v5: gold torus (lit top-left) + mark-gold star interior,
  transparent ground, all luminous elements fade to transparent. Soft star shadow for lift.
  Square viewBox for favicons / coins / merch. Matches onecocreation-lockup.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 156 156" width="156" height="156" role="img" aria-label="One Cocreation mark">
  <defs>
    <radialGradient id="coinShadowM">
      <stop offset="0%" stop-color="#1A0E30" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#1A0E30" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1A0E30" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starShadowM" cx="76" cy="76.5" r="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#120A24" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#120A24" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#120A24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starGlowM" cx="72" cy="72" r="42.16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.97"/>
      <stop offset="10%" stop-color="#FCFDF6" stop-opacity="0.90"/>
      <stop offset="26%" stop-color="#FCD877" stop-opacity="0.60"/>
      <stop offset="50%" stop-color="#F0B347" stop-opacity="0.24"/>
      <stop offset="78%" stop-color="#B87A22" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
