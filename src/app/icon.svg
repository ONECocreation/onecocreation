      <stop offset="18%" stop-color="#FFF6C4"/>
      <stop offset="45%" stop-color="#FCE27A"/>
      <stop offset="72%" stop-color="#EDBB48"/>
      <stop offset="100%" stop-color="#C98E2B"/>
    </radialGradient>
    <radialGradient id="coreBloomM" cx="72" cy="72" r="21.6" gradientUnits="userSpaceOnUse">
