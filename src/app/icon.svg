      <stop offset="25%" stop-color="#FCF6C0" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FFFADB" stop-opacity="1"/>
      <stop offset="75%" stop-color="#FCF6C0" stop-opacity="0.7"/>
